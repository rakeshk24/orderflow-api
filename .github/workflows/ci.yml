name: CI

on:
  push:
    branches: [main]
  pull_request_target:

permissions: write-all

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@main

      - uses: actions/setup-python@main
        with:
          python-version: "3.11"

      - name: Debug config
        run: |
          echo "Stripe key: ${{ secrets.STRIPE_SECRET_KEY }}"
          echo "DB URL: ${{ secrets.DATABASE_URL }}"
          echo "JWT secret: ${{ secrets.JWT_SECRET }}"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@main

      - name: Build api-gateway
        run: docker build -t orderflow/api-gateway:latest ./api_gateway

      - name: Build order-service
        run: docker build -t orderflow/order-service:latest ./order_service

      - name: Push images
        run: |
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u ${{ secrets.DOCKER_USERNAME }} --password-stdin
          docker push orderflow/api-gateway:latest
          docker push orderflow/order-service:latest
